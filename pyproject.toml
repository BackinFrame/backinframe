[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "backinframe"
version = "0.1.1"
description = "Sends a forgotten photo or video to the people you choose now and then: web app, ntfy, e-mail, Telegram, Signal, Matrix or Discord."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pillow>=10.3",
    "pillow-heif>=0.16",
    "qrcode>=7.4",
    "cryptography>=42",
    "http-ece>=1.2",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
security = ["bandit>=1.8", "pip-audit>=2.7"]
test = ["pytest>=8", "pyyaml>=6", "pytest-timeout>=2.3", "aiosmtpd>=1.4", "playwright>=1.45", "axe-playwright-python>=0.1.8"]

[project.scripts]
backinframe = "backinframe.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
backinframe = ["templates/*.html", "static/*", "locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
timeout = 300
markers = [
    "ntfy: functional tests against a real ntfy server binary (set NTFY_BIN or put ntfy on PATH)",
    "ffmpeg: needs ffmpeg/ffprobe",
    "security: security checks after OWASP ASVS 5.0 and the OWASP Top 10 (run alone: pytest -m security)",
]

[tool.bandit]
# Reviewed, accepted findings (see docs/security.md, "Static analysis"):
# B404/B603/B607 ffmpeg/ffprobe/exiftool get argument lists, never a shell, and only paths we found ourselves;
# B311 random picks photos and send times, not secrets (tokens come from the secrets module);
# B104 binding to 0.0.0.0 is what a container needs; B105/B106/B107 empty default passwords mean "not set".
skips = ["B404", "B603", "B607", "B311", "B104", "B105", "B106", "B107"]
